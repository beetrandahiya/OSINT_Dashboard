<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connections · World Watch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/static/suite.css">
<link rel="stylesheet" href="/static/connections.css">
</head>
<body>
<header class="suite-top" id="top"></header>
<aside id="panel" class="panel" aria-live="polite"></aside>
<main id="stage" aria-label="Ownership structure">
  <svg id="graph" role="img" aria-label="Who owns whom"><g id="world"><g id="edges"></g><g id="nodes"></g></g></svg>
  <div id="stage-empty" class="stage-empty"></div>
  <div class="stage-tools panel">
    <button class="btn" id="fit" title="Fit everything in view">Fit</button>
    <button class="btn" id="zin" aria-label="Zoom in">+</button>
    <button class="btn" id="zout" aria-label="Zoom out">−</button>
    <span id="walk" class="soft"></span>
  </div>
  <div class="legend panel" id="legend"></div>
</main>
<script type="module" src="/static/js/connections.js"></script>
</body>
</html>
