<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>World Watch</title>
<link rel="stylesheet" href="/static/vendor/maplibre-gl.css">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div id="map" aria-label="World map"></div>

<aside class="glass sidebar" id="sidebar">
  <header class="side-head">
    <h1>World Watch</h1>
    <div class="seg" role="group" aria-label="Map shape">
      <button id="flat" aria-pressed="true">Map</button>
      <button id="globe" aria-pressed="false">Globe</button>
    </div>
  </header>
  <div class="seg wide" role="group" aria-label="Place">
    <button id="world" aria-pressed="true">World</button>
    <button id="home" aria-pressed="false">Munich</button>
    <a href="/lookup">Lookup</a>
  </div>
  <div class="chips" id="chips" role="group" aria-label="Layers"></div>
  <ul class="list" id="list" role="listbox" aria-label="Latest events"></ul>
  <div class="munich" id="munich" hidden></div>
</aside>

<div class="right">
  <section class="glass detail" id="detail" hidden aria-live="polite"></section>
  <span class="spring"></span>
  <section class="glass feeds" id="feeds">
    <button class="feeds-head" id="feeds-toggle" aria-expanded="false">
      <span class="dot" id="feeds-dot"></span><span id="feeds-sum">Connecting to the feeds</span><span class="chev" aria-hidden="true"></span>
    </button>
    <div class="feeds-body" id="feeds-body" hidden></div>
  </section>
</div>

<div class="glass markets" aria-label="Markets and space weather"><span id="markets" class="quotes"></span><span id="spaceweather" class="quotes"></span></div>

<div class="banner" id="banner" hidden></div>

<script src="/static/vendor/maplibre-gl.js"></script>
<script type="module" src="/static/js/main.js"></script>
</body>
</html>
