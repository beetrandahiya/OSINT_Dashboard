<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>World Watch</title>
<link rel="stylesheet" href="/static/vendor/maplibre-gl.css">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div id="map" aria-label="World map"></div>

<aside class="glass sidebar" id="sidebar">
  <header class="side-head">
    <h1>World Watch</h1><button class="mini" id="side-mini" aria-label="Minimise the panel" title="Minimise"></button>
    <div class="seg" role="group" aria-label="Map shape">
      <button id="flat" aria-pressed="true">Map</button>
      <button id="globe" aria-pressed="false">Globe</button>
    </div>
    <button class="toggle3d" id="three" aria-pressed="false" title="Terrain and buildings in 3D; right-drag or Ctrl-drag to tilt and turn">3D</button>
    <button class="gear" id="settings-btn" aria-label="Settings" title="Settings: theme, ground, colours, motion"><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M8.6 1h2.8l.4 2.3a7 7 0 0 1 1.7 1l2.2-.9 1.4 2.4-1.8 1.5a7 7 0 0 1 0 2l1.8 1.5-1.4 2.4-2.2-.9a7 7 0 0 1-1.7 1l-.4 2.3H8.6l-.4-2.3a7 7 0 0 1-1.7-1l-2.2.9-1.4-2.4 1.8-1.5a7 7 0 0 1 0-2L2.9 6.8l1.4-2.4 2.2.9a7 7 0 0 1 1.7-1zM10 7a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/></svg></button>
  </header>
  <div class="seg wide" role="group" aria-label="Place">
    <button id="world" aria-pressed="true">World</button>
    <button id="home" aria-pressed="false">Munich</button>
    <a href="/lookup">Lookup</a>
  </div>
  <div class="find" id="find"><input id="find-q" type="search" placeholder="Find a person or country" aria-label="Find a person or country" spellcheck="false" autocomplete="off"><ul class="find-list" id="find-list" hidden></ul></div>
  <div class="chips" id="chips" role="group" aria-label="Layers"></div>
  <ul class="list" id="list" role="listbox" aria-label="Latest events"></ul>
  <div class="munich" id="munich" hidden></div>
</aside>

<div class="right">
  <section class="glass detail" id="detail" hidden aria-live="polite"></section>
  <span class="spring"></span>
  <section class="glass feeds" id="feeds">
    <button class="feeds-head" id="feeds-toggle" aria-expanded="false">
      <span class="dot" id="feeds-dot"></span><span id="feeds-sum">Connecting to the feeds</span><span class="chev" aria-hidden="true"></span>
    </button>
    <div class="feeds-body" id="feeds-body" hidden></div>
  </section>
</div>

<div class="loadbar" id="loadbar" hidden></div>
<div class="glass legend" id="legend" aria-label="What the symbols mean"><div class="lg-head"><h3>Legend</h3><button class="mini" id="legend-mini" aria-label="Minimise the legend" title="Minimise"></button></div><div class="lg-body"></div></div>
<div class="glass markets" id="marketsbar" aria-label="Markets and space weather"><button class="mini" id="markets-mini" aria-label="Minimise the markets strip" title="Minimise"></button><span id="markets" class="quotes"></span><span id="spaceweather" class="quotes"></span></div>

<div class="banner" id="banner" hidden></div>

<script src="/static/vendor/maplibre-gl.js"></script>
<script type="module" src="/static/js/main.js"></script>
</body>
</html>
